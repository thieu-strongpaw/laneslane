<!-- gallery/templates/gallery/gallery/html -->

{% extends "base.html" %}
{% load static %}

{% block extra_css %}
	<link rel="stylesheet" href="{% static 'gallery/css/gallery.css' %}">
{% endblock %}

{% block content %}

<h1> this will be the gallery</h1>


<div class="gallery">

	{% for item in images %}

	<div class="gallery-item">
		<img src="{{ item.image.url }}" alt="{{ item.title }}">

		<h3>{{ item.title }}</h3>
		<p>{{ item.description }}</p>
	</div>

	{% endfor %}
</div>

{% endblock %}
