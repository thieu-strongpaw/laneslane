# Dedicated loopback listener for the existing Cloudflare connector.
Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName art.example.com
    LimitRequestBody 26214400

    # Only HTTPS Cloudflare routes should target this private listener.
    RequestHeader set X-Forwarded-Proto "https"

    Alias /static/ /srv/laneslane/staticfiles/
    <Directory /srv/laneslane/staticfiles>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /media/ /var/lib/laneslane/media/
    <Directory /var/lib/laneslane/media>
        Options -Indexes -ExecCGI
        AllowOverride None
        SetHandler default-handler
        Header always set X-Content-Type-Options "nosniff"
        Require all granted
    </Directory>

    WSGIDaemonProcess laneslane user=laneslane group=www-data processes=2 threads=5 python-home=/srv/laneslane/app/.venv python-path=/srv/laneslane/app
    WSGIProcessGroup laneslane
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /srv/laneslane/app/deploy/apache.wsgi
    <Directory /srv/laneslane/app/deploy>
        <Files apache.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/laneslane-error.log
    CustomLog ${APACHE_LOG_DIR}/laneslane-access.log combined
</VirtualHost>
